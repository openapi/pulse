<svg xmlns="http://www.w3.org/2000/svg" width="880" height="132" viewBox="0 0 880 132" role="img" aria-label="OpenAPI Pulse — week 37">
  <title>OpenAPI Pulse — week 37</title>
  <style>
    text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Liberation Sans',sans-serif; }
    .dot, .ring { transform-box: fill-box; transform-origin: center; }
    .dot { animation: beat 1.6s ease-in-out infinite; }
    .ring { animation: halo 1.6s ease-out infinite; }
    .trace { transform: translateX(24px); animation: trace 9s linear infinite; }
    @keyframes beat { 0%, 100% { opacity: 1; transform: scale(1); } 45% { opacity: 0.55; transform: scale(0.7); } }
    @keyframes halo { 0% { opacity: 0.7; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(2.6); } }
    @keyframes trace { from { transform: translateX(24px); } to { transform: translateX(669px); } }
    @media (prefers-reduced-motion: reduce) {
      .dot, .ring, .trace { animation: none; }
      .ring { opacity: 0; }
    }
  </style>
  <defs><clipPath id="card"><rect x="1" y="1" width="878" height="130" rx="9.5"/></clipPath></defs>
