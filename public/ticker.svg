  <text x="72" y="29" fill="#1f2328" font-size="13" font-weight="700" letter-spacing="1.6">OPENAPI PULSE</text>
  <text x="210" y="29" fill="#59636e" font-size="13" font-weight="700">·</text>
  <text x="224" y="29" fill="#59636e" font-size="13" font-weight="600" letter-spacing="1.6">WEEK 37</text>
  <rect x="642" y="12" width="214" height="24" rx="12" fill="#1f2328"/>
