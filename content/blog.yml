# Openapi Pulse — the blog relay queues.
#
# The Openapi blog (https://openapi.com/blog) is where the ecosystem already
# publishes editorial content. Every edition of the Pulse relays the entry at
# the TOP of each queue below into Discussions, as a short extract that links
# back to the full article:
#
#   news      ← blog category "News"          → discussions "Announcements"
#   insights  ← blog category "API Insights"  → discussions "API Engineering"
#
# Unlike the people, API and topic queues, these do not rotate: an article is
# relayed once and never again. `publish.py` moves what it posted into
# `relayed:` below, and `sync.py` never puts a relayed slug back — so the
# retirement is recorded by whatever actually published it, and a failed
# publish leaves the entry at the top to be retried on the next edition.
#
# The order is the blog's own: newest first, because for news freshness is the
# running order. `sync.py` rewrites both queues from the first two listing
# pages, so an article that ages off the front of the blog before it was ever
# relayed is dropped — by then it is not news any more.
#
# These files are edited as text, never reserialised, so the values are plain
# and single-line. Titles routinely contain a colon; the reader splits on the
# first one, so that survives.

