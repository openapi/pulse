# --- Rotazione settimanale --------------------------------------------------
# La card mostra sempre il PRIMO nickname di ogni lista, con l'avatar preso da
# https://github.com/<nickname>.png e incorporato nell'SVG.
#
# Le due liste NON si scrivono a mano: `sync.py` le allinea alle fonti reali
#
#   developers   ← membri pubblici dell'organizzazione
#                  https://github.com/orgs/openapi/people
#   contributors ← registro dei contributor
#                  https://github.com/openapi/contributors
#
# Il sync preserva l'ordine: chi c'è già resta al suo posto, i nuovi entrano in
# fondo alla coda, chi sparisce dalla fonte viene rimosso.
#
# `rotate.py` sposta il primo elemento in fondo alla lista, quindi ogni
# settimana entra in scena il successivo e nessuno si ripete finché non è
# passato tutto il giro. Per far uscire prima qualcuno, spostalo a mano in
# testa.
#
#   python3 generator/sync.py     # allinea le liste alle fonti
#   python3 generator/rotate.py   # avanza la settimana e ruota
#
# Nickname esclusi dalla rotazione anche se presenti nelle fonti upstream.
# La card serve a dare visibilità a chi collabora con Openapi, non a chi la
# pubblica: per questo l'autore del sistema si tiene fuori.
