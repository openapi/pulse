# Openapi Pulse — the editorial content of the next edition.
#
# Everything here describes the edition that goes out NEXT. The entry at the
# top of each queue is the one that will be on the card; publishing moves it to
# the bottom, so the queues keep turning on their own once you stop curating
# them. To choose who or what comes up next, move a line to the top.
#
# The full cycle, once per edition:
#
#   python3 generator/sync.py      # refresh the queues from their sources
#   python3 generator/build.py     # render the card for the top of each queue
#   python3 generator/publish.py   # post the edition, and relay the blog
#   python3 generator/rotate.py    # advance the queues for the next one
#
# The APIs, the discussion topics and the blog relay live in their own files —
# content/apis.yml, content/topics.yml and content/blog.yml — because each of
# their entries is a record rather than a bare handle.

week: 46
year: 2026

# The card has a single call to action: the whole image links here.
cta:
  text: JOIN THE COMMUNITY
  url: https://github.com/orgs/openapi/discussions

# --- Publishing to GitHub Discussions ---------------------------------------
# `publish.py` opens one post per edition in the category named below.
#
# The category CANNOT be created through the API — there is no mutation and no
# REST endpoint for it. Create it once by hand at
#   https://github.com/openapi/discussions/discussions/categories
#
# Pinning cannot be automated either: Repository.pinnedDiscussions is readable,
# but nothing writes it. The way around it is to create ONE permanent
# discussion, pin it by hand once, and record its number here. `publish.py`
# rewrites that post's body every edition, so the pinned entry always points at
# the latest one without ever needing to be pinned again.
discussions:
  repo: openapi/discussions
  category: Openapi Pulse
  index: 3

# --- The blog relay -----------------------------------------------------------
# Every edition also relays the Openapi blog into Discussions: the top of each
# queue in content/blog.yml goes out as a short extract linking back to the
# full article. The mapping below is blog queue → discussions category.
#
# Those categories, like the one above, cannot be created through the API. They
# have to exist by hand in the discussions repository; if one is missing the
# relay says so and the edition itself still goes out.
blog:
  url: https://openapi.com/blog
  relay:
    news: Announcements
    insights: API Engineering

# --- The people ---------------------------------------------------------------
# The card shows the handle at the top of each queue, with the avatar pulled
# from https://github.com/<handle>.png and embedded in the SVG.
#
# These lists are not written by hand: `sync.py` aligns them with the real
# sources.
#
#   developers   ← public members of the organization
#                  https://github.com/orgs/openapi/people
#   contributors ← the contributors registry
#                  https://github.com/openapi/contributors
#
# The sync preserves the order: whoever is already here keeps their position,
# newcomers are appended to the bottom, and whoever disappears upstream is
# dropped.
#
# Handles excluded from the rotation even when the sources list them. The card
# exists to give visibility to the people who work on and with Openapi, not to
# the person publishing it, so the author of the system stays out of it.
exclude:
  - francescobianco

