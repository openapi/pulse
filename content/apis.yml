# Openapi Pulse — the API rotation queue.
#
# The API at the TOP of this list is the one going out in the next edition.
# To choose it, move its entry to the top; publishing moves it to the bottom,
# so the queue keeps turning on its own once you stop curating it.
#
# `sync.py` refreshes this list from the public API library
#   https://console.openapi.com/apis
# It preserves the order you set: APIs already here keep their position, ones
# newly published by Openapi are appended to the bottom, and ones that
# disappear from the library are dropped.

